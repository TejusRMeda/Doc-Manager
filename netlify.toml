# Netlify configuration for Visa Doc Collator

[build]
  # No build command needed - static HTML site
  publish = "."

# Netlify is retired as a serving host — Vercel is canonical (see og:url and
# sitemap.xml). Netlify publishes statically and cannot run the api/*.js
# functions, so /api/track would 404 here and analytics events would silently
# vanish for anyone who landed on this domain. Send everything to Vercel.
#
# Note: this also redirects Netlify deploy previews. Use the Vercel preview URL
# on pull requests instead.
[[redirects]]
  from = "/*"
  to = "https://visa-doc-collator.vercel.app/:splat"
  status = 301
  force = true

# Headers for security and caching
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/Appscreens/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
